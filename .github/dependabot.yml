version: 2

updates:
  # ── npm dependencies ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    # All dependency PRs require manual review before merge.
    reviewers: []

    groups:
      # ── Tier 1: Expo ecosystem ─────────────────────────────────────────────
      # All Expo SDK packages move together — partial upgrades break the build.
      # react, react-native, and react-test-renderer are included because Expo
      # pins them to specific versions in each SDK release.
      # REQUIRES MANUAL REVIEW before merge — see DEPENDENCY_POLICY.md.
      expo-ecosystem:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "@expo-google-fonts/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-test-renderer"
          - "react-native-safe-area-context"
          - "react-native-screens"
          - "react-native-gesture-handler"
          - "react-native-reanimated"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 2: React Navigation ───────────────────────────────────────────
      # Navigation packages share internal APIs and must stay on the same major.
      # REQUIRES MANUAL REVIEW before merge.
      react-navigation:
        patterns:
          - "@react-navigation/*"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 3: React Native UI libraries ─────────────────────────────────
      # react-native-paper and react-native-material-you-colors move together
      # since they share the Material You design system.
      react-native-ui:
        patterns:
          - "react-native-paper"
          - "react-native-material-you-colors"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 4: Testing stack ──────────────────────────────────────────────
      # Must stay compatible with jest-expo and React.
      # REQUIRES MANUAL REVIEW before merge (react-test-renderer must equal react).
      testing:
        patterns:
          - "jest"
          - "jest-expo"
          - "react-test-renderer"
          - "@testing-library/*"
          - "@types/jest"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 5: TypeScript tooling ─────────────────────────────────────────
      # Moves independently from runtime deps — safe to merge after CI passes.
      # Major version upgrades are blocked (see ignore rules below).
      typescript-tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "@typescript-eslint/*"
          - "eslint"
          - "babel-preset-expo"
          - "@babel/*"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 6: Utility libraries ──────────────────────────────────────────
      # No runtime coupling to Expo or React Native — safe independently.
      # Minor/patch upgrades are auto-mergeable after CI passes.
      utility-libraries:
        patterns:
          - "dayjs"
          - "zod"
          - "react-hook-form"
          - "@hookform/*"
          - "react-native-uuid"
        update-types:
          - "minor"
          - "patch"

    # ── Ignore rules ───────────────────────────────────────────────────────────
    # IMPORTANT: ignore rules must NOT overlap with group patterns for minor/patch.
    # If a package is in both a group and an ignore rule for the same update-type,
    # the ignore rule wins and the package is excluded from the group PR.
    #
    # Strategy: only block MAJOR upgrades via ignore. Minor/patch are handled by
    # the groups above (which require manual review before merge).
    ignore:
      # ── Expo SDK major upgrades ───────────────────────────────────────────
      # Block expo major upgrades (e.g. SDK 52 → 53) — requires full migration.
      # Run `npx expo install --fix` and update all Tier 1 packages together.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]

      # Block expo-router major upgrades — must match expo SDK major.
      - dependency-name: "expo-router"
        update-types: ["version-update:semver-major"]

      # Block ALL expo-* package major upgrades — each major maps to a new SDK.
      # Expo SDK 52 uses expo-location@18, expo-constants@17, expo-asset@11, etc.
      # Expo SDK 57 versions (57.x) are NOT compatible with SDK 52 — they require
      # a full SDK migration. Close any PRs proposing expo-*@57.x.
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]

      # Block @expo/* scope major upgrades (e.g. @expo/vector-icons v14 → v15)
      # @expo/vector-icons@15 requires expo-font>=14 which belongs to SDK 53+.
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]

      # Block @expo-google-fonts/* major upgrades
      - dependency-name: "@expo-google-fonts/*"
        update-types: ["version-update:semver-major"]

      # ── React / React Native major upgrades ───────────────────────────────
      # Block React major upgrades (React 19+) until Expo explicitly supports them.
      # Expo 52 = React 18. Upgrading React to 19 without a matching Expo SDK bump
      # will break expo-modules, react-native-reanimated, and react-test-renderer.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

      # Block React Native major upgrades — always tied to a specific Expo SDK release.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

      # Block react-test-renderer major upgrades — must always equal react's major.
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major"]

      # Block react-native-reanimated major upgrades — must match Expo SDK.
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-major"]

      # Block react-native-screens major upgrades — must match Expo SDK.
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-major"]

      # Block react-native-gesture-handler major upgrades — must match Expo SDK.
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major"]

      # Block react-native-safe-area-context major upgrades — SDK-pinned.
      # v5.x requires React Native ^0.85+ (we're on 0.76.7 for SDK 52).
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major"]

      # Block @react-navigation/* major upgrades — requires coordinated migration.
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major"]

      # ── TypeScript ecosystem major upgrades ───────────────────────────────
      # Block TypeScript major upgrades (e.g. 5.x → 7.x).
      # typescript@7 breaks @typescript-eslint which requires typescript <6.1.0.
      # Any TypeScript major upgrade requires auditing the entire toolchain first.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # Block @types/* major upgrades — may conflict with current TypeScript version.
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-major"]

      # ── Babel major upgrades ──────────────────────────────────────────────
      # Block @babel/core major upgrades (v7 → v8).
      # babel@8 is a significant breaking change requiring coordinated migration
      # of babel-preset-expo, all @babel/* plugins, and build tooling.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

      # Block babel-preset-expo major upgrades — must match Expo SDK.
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Group ALL GitHub Actions updates together.
      # Action major version bumps (e.g. v4 → v7) change the Node.js runtime
      # and must be applied to all workflow files simultaneously to avoid
      # partial upgrades where some actions use Node20 and others use Node24.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
