version: 2

updates:
  # ── npm dependencies ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    # All dependency PRs require manual review before merge.
    reviewers: []

    groups:
      # ── Tier 1: Expo ecosystem ─────────────────────────────────────────────
      # All Expo SDK packages move together — partial upgrades break the build.
      # react, react-native, and react-test-renderer are included because Expo
      # pins them to specific versions in each SDK release.
      # REQUIRES MANUAL REVIEW before merge — see DEPENDENCY_POLICY.md.
      expo-ecosystem:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "@expo-google-fonts/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-test-renderer"
          - "react-native-safe-area-context"
          - "react-native-screens"
          - "react-native-gesture-handler"
          - "react-native-reanimated"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 2: React Navigation ───────────────────────────────────────────
      # Navigation packages share internal APIs and must stay on the same major.
      # REQUIRES MANUAL REVIEW before merge.
      react-navigation:
        patterns:
          - "@react-navigation/*"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 3: React Native UI libraries ─────────────────────────────────
      # react-native-paper and react-native-material-you-colors move together
      # since they share the Material You design system.
      react-native-ui:
        patterns:
          - "react-native-paper"
          - "react-native-material-you-colors"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 4: Testing stack ──────────────────────────────────────────────
      # Must stay compatible with jest-expo and React.
      # REQUIRES MANUAL REVIEW before merge (react-test-renderer must equal react).
      testing:
        patterns:
          - "jest"
          - "jest-expo"
          - "react-test-renderer"
          - "@testing-library/*"
          - "@types/jest"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 5: TypeScript tooling ─────────────────────────────────────────
      # Moves independently from runtime deps — safe to merge after CI passes.
      typescript-tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "@typescript-eslint/*"
          - "eslint"
          - "babel-preset-expo"
          - "@babel/*"
        update-types:
          - "minor"
          - "patch"

      # ── Tier 6: Utility libraries ──────────────────────────────────────────
      # No runtime coupling to Expo or React Native — safe independently.
      # Minor/patch upgrades are auto-mergeable after CI passes.
      utility-libraries:
        patterns:
          - "dayjs"
          - "zod"
          - "react-hook-form"
          - "@hookform/*"
          - "react-native-uuid"
        update-types:
          - "minor"
          - "patch"

    # IMPORTANT: ignore rules must NOT overlap with group patterns for minor/patch.
    # If a package is in both a group and an ignore rule for the same update-type,
    # the ignore rule wins and the package is excluded from the group PR — causing
    # incomplete grouped upgrades that fail CI.
    #
    # Strategy: only block MAJOR upgrades via ignore. Minor/patch are handled by
    # the groups above (which require manual review before merge).
    ignore:
      # Block React major upgrades (React 19+) until Expo explicitly supports them.
      # Expo 52 = React 18. Upgrading React to 19 without a matching Expo SDK bump
      # will break expo-modules, react-native-reanimated, and react-test-renderer.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

      # Block React Native major upgrades — always tied to a specific Expo SDK release.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

      # Block react-test-renderer major upgrades — must always equal react's major.
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major"]

      # Block expo major upgrades (e.g. SDK 52 → 53) — requires manual migration.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]

      # Block expo-router major upgrades — must match expo SDK major.
      - dependency-name: "expo-router"
        update-types: ["version-update:semver-major"]

      # Block react-native-reanimated major upgrades — must match Expo SDK.
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-major"]

      # Block react-native-screens major upgrades — must match Expo SDK.
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-major"]

      # Block react-native-gesture-handler major upgrades — must match Expo SDK.
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major"]

      # Block react-native-safe-area-context major upgrades — SDK-pinned.
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major"]

      # Block @react-navigation/* major upgrades — requires coordinated migration.
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
