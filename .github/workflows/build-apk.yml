name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install npm dependencies
        run: npm install

      - name: Generate icon assets
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev > /dev/null 2>&1
          npm install canvas --no-save > /dev/null 2>&1 && node scripts/generate-icons.js || echo "Using placeholder icons"

      - name: Expo prebuild
        run: EXPO_NO_DOTENV=1 npx expo prebuild --platform android --clean
        env:
          CI: '1'

      # ── Debug: print key generated files ─────────────────────────────────────
      - name: Print generated Android files for debugging
        run: |
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== expo-font/android/build.gradle ==="
          cat node_modules/expo-font/android/build.gradle || echo "NOT FOUND"
          echo ""
          echo "=== ExpoModulesCorePlugin.gradle (lines 80-95) ==="
          sed -n '80,95p' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle || echo "NOT FOUND"

      # ── Patch Android project for Expo 51 + AGP 8 compatibility ──────────────
      - name: Patch Android project files
        run: |
          # 1. Pin Gradle wrapper to 8.3
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-bin.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties

          # 2. Force AGP 8.1.4 in build.gradle (classpath had no version — Gradle
          #    was picking latest 8.5+ which broke expo-modules-core)
          sed -i "s|classpath('com.android.tools.build:gradle')|classpath('com.android.tools.build:gradle:8.1.4')|" \
            android/build.gradle
          echo "AGP: $(grep 'com.android.tools.build:gradle' android/build.gradle)"

          # 3. Patch ExpoModulesCorePlugin.gradle — components.release removed in AGP 8
          find node_modules/expo-modules-core/android -name "ExpoModulesCorePlugin.gradle" | while read f; do
            sed -i "s/from components\.release/from components.findByName('release') ?: components.findByName('debug')/g" "$f"
            echo "Patched ExpoModulesCorePlugin: $f"
          done

          # 4. Replace 'expo-module-gradle-plugin' in every expo module build.gradle
          #    with explicit 'com.android.library' + android block with sdk versions.
          #    The plugin was doing this configuration automatically; we replicate it.
          REPLACEMENT="plugins {\n  id 'com.android.library'\n}\nandroid {\n  compileSdkVersion 34\n  defaultConfig {\n    minSdkVersion 23\n    targetSdkVersion 34\n  }\n}"
          find node_modules -path "*/android/build.gradle" | while read f; do
            if grep -q "expo-module-gradle-plugin" "$f"; then
              # Replace the entire plugins{} block that contains expo-module-gradle-plugin
              perl -i -0pe 's/plugins\s*\{[^}]*expo-module-gradle-plugin[^}]*\}/plugins {\n  id '"'"'com.android.library'"'"'\n}/g' "$f"
              # Also handle apply plugin syntax
              sed -i "s|apply plugin: 'expo-module-gradle-plugin'||g" "$f"
              sed -i 's|apply plugin: "expo-module-gradle-plugin"||g' "$f"
              # Ensure android block has compileSdkVersion if missing
              if ! grep -q "compileSdkVersion" "$f"; then
                sed -i "/^android {/a\\  compileSdkVersion 34\n  defaultConfig { minSdkVersion 23; targetSdkVersion 34 }" "$f"
              fi
              echo "Patched: $f"
            fi
          done

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── Generate release keystore on the runner ───────────────────────────────
      - name: Generate release keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/lumio-release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Lumio App, OU=Mobile, O=Lumio, L=Unknown, ST=Unknown, C=US"
          echo "Keystore: $(wc -c < android/app/lumio-release.keystore) bytes"

      # ── Pre-bundle JS ─────────────────────────────────────────────────────────
      - name: Bundle JavaScript
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false \
            --reset-cache
          echo "Bundle: $(du -sh android/app/src/main/assets/index.android.bundle)"
        env:
          NODE_ENV: production
          EXPO_NO_DOTENV: '1'

      # ── Build signed release APK ──────────────────────────────────────────────
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            -Dfile.encoding=UTF-8 \
            -Pandroid.injected.signing.store.file="$(pwd)/app/lumio-release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            2>&1 | tee /tmp/gradle.log
          CODE=${PIPESTATUS[0]}
          if [ $CODE -ne 0 ]; then
            echo "=== GRADLE ERROR SUMMARY ==="
            grep -E "FAILED|Exception|> Task|Caused by|error:" /tmp/gradle.log | head -60 || true
            echo "=== LAST 80 LINES ==="
            tail -80 /tmp/gradle.log || true
            exit $CODE
          fi
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
          CI: 'true'

      - name: Collect APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p release-apks
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "release-apks/lumio-${VERSION}.apk"
            echo "APK: $(du -sh release-apks/lumio-${VERSION}.apk)"
          else
            echo "ERROR: No APK found!" && exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumio-${{ env.VERSION }}
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          BODY="## Lumio ${VERSION}\n\nSigned release APK for Android.\n\n### Install\n1. Download \`lumio-${VERSION}.apk\` from Assets below\n2. Phone: Settings \u2192 Security \u2192 Install unknown apps \u2192 enable for your file manager\n3. Open the APK and tap Install"
          RESP=$(curl -sf -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" "${API}/releases" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"Lumio ${VERSION}\",\"body\":\"${BODY}\",\"draft\":false,\"prerelease\":false}")
          RELEASE_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Release $RELEASE_ID created"
          APK="release-apks/lumio-${VERSION}.apk"
          curl -sf -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=lumio-${VERSION}.apk"
          echo "APK uploaded to release"
