name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install npm dependencies
        run: npm install

      - name: Generate icon assets
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev > /dev/null 2>&1
          npm install canvas --no-save > /dev/null 2>&1 && node scripts/generate-icons.js || echo "Using placeholder icons"

      - name: Expo prebuild
        run: EXPO_NO_DOTENV=1 npx expo prebuild --platform android --clean
        env:
          CI: '1'

      # Expo 52 / expo-modules-core 2.x targets Gradle 8.6 + AGP 8.4.
      # On ubuntu-latest the generated wrapper may be 8.10+ which breaks with:
      #   "unknown property 'release'" (SoftwareComponent API removed in 8.8)
      # Gradle 8.3 is too old (Kotlin settings-plugin compileKotlin fails).
      # Print generated versions first so future failures are easier to debug,
      # then pin to the exact versions Expo 52 is tested against.
      - name: Inspect generated android project versions
        run: |
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== android/settings.gradle (first 30 lines) ==="
          head -30 android/settings.gradle || true

      - name: Pin Gradle wrapper to 8.6
        run: |
          PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.6-bin.zip|' "$PROPS"
          echo "Pinned: $(grep distributionUrl $PROPS)"

      - name: Pin Android Gradle Plugin to 8.4.2
        run: |
          BUILD="android/build.gradle"
          # classpath style: classpath("com.android.tools.build:gradle:X.Y.Z")
          sed -i 's/com\.android\.tools\.build:gradle:[0-9][0-9.]*/com.android.tools.build:gradle:8.4.2/g' "$BUILD"
          # plugins{} id style: id("com.android.application") version "X.Y.Z"
          sed -i 's/id("com\.android\.application") version "[0-9][0-9.]*"/id("com.android.application") version "8.4.2"/g' "$BUILD"
          sed -i 's/id("com\.android\.library") version "[0-9][0-9.]*"/id("com.android.library") version "8.4.2"/g' "$BUILD"
          echo "=== android/build.gradle after patch ==="
          cat "$BUILD"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Pre-bundle JS so Gradle does not need Metro at build time
      - name: Bundle JavaScript
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false \
            --reset-cache
          echo "Bundle: $(du -sh android/app/src/main/assets/index.android.bundle)"
        env:
          NODE_ENV: production
          EXPO_NO_DOTENV: '1'

      # Generate keystore and build signed release APK in one step so the
      # signing credentials are in scope as shell variables for both commands.
      - name: Build signed release APK
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
          CI: 'true'
        run: |
          # Keystore is regenerated fresh on every run — password only needs
          # to be consistent within this single job, never stored anywhere.
          KS_FILE="$(pwd)/android/app/lumio-release.keystore"
          KS_ALIAS="lumio-key"
          KS_PASS="build-$(date +%Y%m%d)"
          KEY_PASS="build-$(date +%Y%m%d)"

          # Generate a fresh signing keystore
          keytool -genkey -v \
            -keystore "$KS_FILE" \
            -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Lumio App, OU=Mobile, O=Lumio, L=Unknown, ST=Unknown, C=US"
          echo "Keystore generated: $(wc -c < $KS_FILE) bytes"

          # Build signed release APK
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            -Dfile.encoding=UTF-8 \
            -Pandroid.injected.signing.store.file="$KS_FILE" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            2>&1 | tee /tmp/gradle.log
          CODE=${PIPESTATUS[0]}
          if [ $CODE -ne 0 ]; then
            echo "=== GRADLE ERROR SUMMARY ==="
            grep -E "FAILED|Exception|> Task|Caused by|error:" /tmp/gradle.log | head -60 || true
            echo "=== LAST 80 LINES ==="
            tail -80 /tmp/gradle.log || true
            exit $CODE
          fi

      - name: Collect APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p release-apks
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "release-apks/lumio-${VERSION}.apk"
            echo "APK: $(du -sh release-apks/lumio-${VERSION}.apk)"
          else
            echo "ERROR: No APK found!" && exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumio-${{ env.VERSION }}
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          APK="release-apks/lumio-${VERSION}.apk"

          echo "APK size: $(du -sh $APK)"
          echo "Tag: $VERSION"
          echo "Repo: $GITHUB_REPOSITORY"

          # Write release notes to a temp file to avoid YAML multiline issues
          printf "Signed release APK for Android.\n\n### Install\n1. Download lumio-%s.apk from Assets below\n2. Phone: Settings > Security > Install unknown apps\n3. Open the APK and tap Install\n" "$VERSION" > /tmp/release-notes.md

          # Create release (skip if already exists)
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lumio ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            || true

          # Upload APK (--clobber replaces existing asset with same name)
          gh release upload "$VERSION" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "Release complete: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
