name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install npm dependencies (strict — no --force or --legacy-peer-deps)
        run: npm install

      - name: Validate dependency tree
        run: |
          set -o pipefail
          npm ls --depth=0 2>&1 | tee /tmp/npm-ls.log
          if grep -qE "UNMET|invalid" /tmp/npm-ls.log; then
            echo "::error::Unmet peer dependencies detected. Fix package.json before releasing."
            cat /tmp/npm-ls.log
            exit 1
          fi
          echo "Dependency tree OK"

      - name: Validate react-test-renderer matches React major
        run: |
          node -e "
            const p = require('./package.json');
            const react = (p.dependencies.react || '').replace(/[^0-9.].*/, '').split('.')[0];
            const rtr = (p.devDependencies['react-test-renderer'] || '').replace(/[^0-9.].*/, '').split('.')[0];
            if (!rtr) { console.error('::error::react-test-renderer missing from devDependencies'); process.exit(1); }
            if (react !== rtr) { console.error('::error::react major (' + react + ') != react-test-renderer major (' + rtr + ')'); process.exit(1); }
            console.log('react-test-renderer major matches React:', react);
          "

      - name: Validate Expo SDK package versions (SDK 52 baseline)
        run: |
          node -e "
            const p = require('./package.json');
            const check = (name, range, actual) => {
              const clean = (actual || '').replace(/[~^]/g,'');
              console.log('  ' + name + ': ' + actual + ' -> ' + clean);
            };
            console.log('Expo SDK 52 package baseline check:');
            check('expo',            '~52.0.x',  p.dependencies.expo);
            check('react',           '18.3.1',   p.dependencies.react);
            check('react-native',    '0.76.x',   p.dependencies['react-native']);
            check('expo-router',     '~4.0.x',   p.dependencies['expo-router']);
            // Fail if react-native drifts from 0.76.x for this SDK
            const rn = (p.dependencies['react-native'] || '');
            if (!rn.startsWith('0.76')) {
              console.error('::error::react-native must be 0.76.x for Expo SDK 52, found: ' + rn);
              process.exit(1);
            }
            const expoVer = (p.dependencies.expo || '').replace(/[~^]/,'');
            if (!expoVer.startsWith('52.')) {
              console.error('::error::expo must be 52.x for this baseline, found: ' + expoVer);
              process.exit(1);
            }
            console.log('Expo SDK baseline OK');
          "

      - name: Generate icon assets
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev > /dev/null 2>&1
          npm install canvas --no-save > /dev/null 2>&1 && node scripts/generate-icons.js || echo "Using placeholder icons"

      - name: Expo prebuild
        run: EXPO_NO_DOTENV=1 npx expo prebuild --platform android --clean
        env:
          CI: '1'

      # The AGP version that expo prebuild generates tells us exactly which Gradle
      # version is required. AGP 8.5/8.6 require Gradle >= 8.7; AGP 8.7 requires
      # Gradle >= 8.9. Gradle 8.8+ breaks expo-modules-core (removes
      # SoftwareComponent.release API). So the only safe version is 8.7.
      # We do NOT patch AGP — only pin the Gradle wrapper.
      - name: Print generated Gradle versions (diagnostic)
        run: |
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== android/build.gradle ==="
          cat android/build.gradle

      - name: Pin Gradle wrapper to 8.7
        run: |
          PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' "$PROPS"
          echo "Pinned: $(grep distributionUrl $PROPS)"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Pre-bundle JS so Gradle does not need Metro at build time
      - name: Bundle JavaScript
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false \
            --reset-cache
          echo "Bundle: $(du -sh android/app/src/main/assets/index.android.bundle)"
        env:
          NODE_ENV: production
          EXPO_NO_DOTENV: '1'

      # Generate keystore and build signed release APK in one step so the
      # signing credentials are in scope as shell variables for both commands.
      - name: Build signed release APK
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
          CI: 'true'
        run: |
          # Keystore is regenerated fresh on every run — password only needs
          # to be consistent within this single job, never stored anywhere.
          KS_FILE="$(pwd)/android/app/lumio-release.keystore"
          KS_ALIAS="lumio-key"
          KS_PASS="build-$(date +%Y%m%d)"
          KEY_PASS="build-$(date +%Y%m%d)"

          # Generate a fresh signing keystore
          keytool -genkey -v \
            -keystore "$KS_FILE" \
            -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Lumio App, OU=Mobile, O=Lumio, L=Unknown, ST=Unknown, C=US"
          echo "Keystore generated: $(wc -c < $KS_FILE) bytes"

          # Build signed release APK
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            -Dfile.encoding=UTF-8 \
            -Pandroid.injected.signing.store.file="$KS_FILE" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            2>&1 | tee /tmp/gradle.log
          CODE=${PIPESTATUS[0]}
          if [ $CODE -ne 0 ]; then
            echo "=== GRADLE ERROR SUMMARY ==="
            grep -E "FAILED|Exception|> Task|Caused by|error:" /tmp/gradle.log | head -60 || true
            echo "=== LAST 80 LINES ==="
            tail -80 /tmp/gradle.log || true
            exit $CODE
          fi

      - name: Collect APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p release-apks
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "release-apks/lumio-${VERSION}.apk"
            echo "APK: $(du -sh release-apks/lumio-${VERSION}.apk)"
          else
            echo "ERROR: No APK found!" && exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lumio-${{ env.VERSION }}
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          APK="release-apks/lumio-${VERSION}.apk"

          echo "APK size: $(du -sh $APK)"
          echo "Tag: $VERSION"
          echo "Repo: $GITHUB_REPOSITORY"

          # Write release notes to a temp file to avoid YAML multiline issues
          printf "Signed release APK for Android.\n\n### Install\n1. Download lumio-%s.apk from Assets below\n2. Phone: Settings > Security > Install unknown apps\n3. Open the APK and tap Install\n" "$VERSION" > /tmp/release-notes.md

          # Create release (skip if already exists)
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lumio ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            || true

          # Upload APK (--clobber replaces existing asset with same name)
          gh release upload "$VERSION" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "Release complete: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
