name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs (arm64 + armv7 + universal)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Java 17 ────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Android SDK via sdkmanager (no external action needed) ─────────
      - name: Setup Android SDK
        run: |
          # Android SDK is pre-installed on ubuntu-latest at $ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "Android build-tools:"
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || echo "build-tools not found, installing..."
          # Accept all licenses silently
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" > /dev/null 2>&1 || true
          echo "Setup complete"

      # ── 5. Install npm dependencies ───────────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 5b. Generate app icon / splash PNG assets ─────────────────────────
      - name: Generate icon assets
        run: |
          # canvas has native bindings — install build deps first
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev 2>/dev/null || true
          npm install canvas --no-save 2>/dev/null || true
          node scripts/generate-icons.js || echo "Icon generation skipped (canvas unavailable)"

      # ── 6. Expo prebuild ──────────────────────────────────────────────────
      - name: Expo prebuild (generate android/ folder)
        run: |
          # EXPO_NO_DOTENV prevents interactive prompts
          EXPO_NO_DOTENV=1 npx expo prebuild \
            --platform android \
            --clean \
            --no-install
        env:
          CI: '1'

      # ── 7. Make gradlew executable ────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 8. Inject Android widget files ────────────────────────────────────
      - name: Inject Android widget
        run: |
          PKG_PATH="android/app/src/main/java/com/lumio/savelater"
          RES_PATH="android/app/src/main/res"

          mkdir -p "$PKG_PATH"
          mkdir -p "$RES_PATH/layout"
          mkdir -p "$RES_PATH/xml"
          mkdir -p "$RES_PATH/drawable"

          # Copy Kotlin widget class
          cp android-widget/LumioWidget.kt "$PKG_PATH/LumioWidget.kt"

          # Copy layout
          cp android-widget/widget_lumio.xml "$RES_PATH/layout/widget_lumio.xml"

          # Copy widget provider info
          cp android-widget/lumio_widget_info.xml "$RES_PATH/xml/lumio_widget_info.xml"

          # Copy widget background drawable
          cp android-widget/widget_background.xml "$RES_PATH/drawable/widget_background.xml"

          # Patch AndroidManifest.xml to register the widget receiver
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Only patch if not already patched
          if ! grep -q "LumioWidget" "$MANIFEST"; then
            WIDGET_RECEIVER='        <receiver android:name=".LumioWidget" android:exported="true">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" \/>\n            <\/intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml\/lumio_widget_info" \/>\n        <\/receiver>'
            sed -i "s|</application>|${WIDGET_RECEIVER}\n    </application>|" "$MANIFEST"
            echo "Widget receiver registered in AndroidManifest.xml"
          else
            echo "Widget already registered"
          fi

      # ── 9. Configure ABI splits ───────────────────────────────────────────
      - name: Configure ABI splits in build.gradle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          # Append ABI splits block — Gradle merges duplicate android{} blocks cleanly
          cat >> "$GRADLE_FILE" << 'GRADLE_EOF'

          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a", "armeabi-v7a", "x86_64"
                      universalApk true
                  }
              }
          }
          GRADLE_EOF
          echo "ABI splits configured"

      # ── 9. Build all APK variants ─────────────────────────────────────────
      - name: Build release APKs
        run: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -Dfile.encoding=UTF-8
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
          CI: 'true'

      # ── 10. List built APKs (debug output) ────────────────────────────────
      - name: List output APKs
        run: |
          echo "=== All APKs built ==="
          find android/app/build/outputs/apk -name "*.apk" | sort

      # ── 11. Collect and rename APKs ───────────────────────────────────────
      - name: Collect APKs
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          APK_DIR="android/app/build/outputs/apk/release"
          mkdir -p release-apks

          # arm64-v8a
          ARM64=$(find "$APK_DIR" -name "*arm64-v8a*.apk" | head -1)
          [ -n "$ARM64" ] && cp "$ARM64" "release-apks/lumio-${VERSION}-arm64-v8a.apk" && echo "Copied arm64"

          # armeabi-v7a
          ARMV7=$(find "$APK_DIR" -name "*armeabi-v7a*.apk" | head -1)
          [ -n "$ARMV7" ] && cp "$ARMV7" "release-apks/lumio-${VERSION}-armeabi-v7a.apk" && echo "Copied armv7"

          # universal
          UNIVERSAL=$(find "$APK_DIR" -name "*universal*.apk" | head -1)
          [ -n "$UNIVERSAL" ] && cp "$UNIVERSAL" "release-apks/lumio-${VERSION}-universal.apk" && echo "Copied universal"

          # Fallback if ABI splits didn't work
          if [ -z "$ARM64" ] && [ -z "$ARMV7" ] && [ -z "$UNIVERSAL" ]; then
            FALLBACK=$(find "$APK_DIR" -name "*.apk" | head -1)
            [ -n "$FALLBACK" ] && cp "$FALLBACK" "release-apks/lumio-${VERSION}-universal.apk" && echo "Copied fallback"
          fi

          echo "=== Release APKs ==="
          ls -lh release-apks/
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # ── 12. Upload APKs as workflow artifacts ─────────────────────────────
      #        Always runs — downloadable from Actions tab even without a tag
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumio-${{ env.VERSION }}-apks
          path: release-apks/
          retention-days: 30

      # ── 13. Create GitHub Release via REST API ────────────────────────────
      #        Uses curl + GITHUB_TOKEN — works on both github.com and GHE
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          API_BASE="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"

          echo "Creating release ${VERSION} on ${API_BASE}..."

          # Create the release
          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API_BASE}/releases" \
            -d "{
              \"tag_name\": \"${VERSION}\",
              \"name\": \"Lumio ${VERSION}\",
              \"body\": \"## Lumio ${VERSION}\n\n### Which APK should I download?\n\n| APK | Best for | Size |\n|---|---|---|\n| \`lumio-${VERSION}-arm64-v8a.apk\` | **Recommended** - Most phones 2018+ (64-bit ARM) | Smallest |\n| \`lumio-${VERSION}-armeabi-v7a.apk\` | Older phones pre-2018 (32-bit ARM) | Small |\n| \`lumio-${VERSION}-universal.apk\` | Any Android device - use if unsure | Largest |\n\n> **Not sure?** Download the **universal** APK.\n\n### How to install\n1. Download the APK from Assets below\n2. On Android: Settings > Security > Install unknown apps - enable\n3. Open the APK and tap Install\",
              \"draft\": false,
              \"prerelease\": false
            }")

          echo "Release response: $RELEASE_RESPONSE"
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Release ID: $RELEASE_ID"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

          # Upload each APK
          for APK in release-apks/*.apk; do
            APK_NAME=$(basename "$APK")
            echo "Uploading ${APK_NAME}..."
            curl -s -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${APK_NAME}"
            echo "Uploaded ${APK_NAME}"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
