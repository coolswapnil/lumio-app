name: Build Android APK

on:
  push:
    tags:
      - 'v*'          # triggers on version tags like v1.0.0, v1.1.0
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Setup Java (required for Android builds) ──────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Setup Android SDK ─────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install Expo CLI & dependencies ───────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli@latest

      # ── 6. Setup EAS CLI (for local builds) ──────────────────────────────
      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      # ── 7. Export the app bundle (prebuild) ──────────────────────────────
      - name: Expo prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── 8. Build debug APK (no signing required) ─────────────────────────
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: '-Xmx4g -Dfile.encoding=UTF-8'

      # ── 9. Rename APK with version tag ───────────────────────────────────
      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          APK_SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK_SRC" "lumio-${VERSION}.apk"
          echo "APK_PATH=lumio-${VERSION}.apk" >> $GITHUB_ENV

      # ── 10. Upload APK as workflow artifact ──────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumio-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 11. Create GitHub Release with APK (only on version tags) ────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lumio ${{ github.ref_name }}
          body: |
            ## Lumio ${{ github.ref_name }}

            ### Install
            1. Download **lumio-${{ github.ref_name }}.apk** below
            2. On your Android device: Settings → Security → enable **Install unknown apps**
            3. Open the downloaded APK and install

            ### What's included
            - Universal save-for-later for links, videos, recipes, books, movies, workouts, places, restaurants, tools and ideas
            - Smart collections with custom icons & colors
            - Location saving with GPS + Google Maps deep-link
            - AI summarization (OpenAI, Anthropic, Gemini, DeepSeek, Groq, Indus, IBM watsonx, Local LLM)
            - Full-text search and filter
            - Light / Dark / System theme
            - All data stored locally on device (SQLite)
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
