name: PR Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  # ── 1. Dependency health (runs first — all other jobs depend on this) ──────
  dependency-health:
    name: Dependency Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      # Must succeed with zero flags — no --force, no --legacy-peer-deps.
      - name: npm install (strict)
        run: npm install

      # npm ls exits non-zero when there are unmet peer deps or invalid packages.
      - name: npm ls (peer dependency check)
        run: |
          set -o pipefail
          npm ls 2>&1 | tee /tmp/npm-ls.log
          if grep -qE "UNMET|invalid" /tmp/npm-ls.log; then
            echo "::error::npm ls reported unmet peer dependencies or invalid packages. Fix package.json."
            cat /tmp/npm-ls.log
            exit 1
          fi
          echo "npm ls OK"

      # npm doctor checks Node/npm health, registry reachability, cache state.
      - name: npm doctor
        run: npm doctor || true

      # Inline Expo SDK 52 baseline check — avoids expo-doctor@latest whose
      # behaviour changes as new SDK versions ship, causing false failures.
      - name: Validate Expo SDK 52 baseline
        run: |
          node -e "
            const p = require('./package.json');
            const rn = (p.dependencies['react-native'] || '');
            const expo = (p.dependencies.expo || '').replace(/[~^]/,'');
            const react = (p.dependencies.react || '');
            if (!expo.startsWith('52.')) {
              console.error('::error::expo must be 52.x, found: ' + expo); process.exit(1);
            }
            if (react !== '18.3.1') {
              console.error('::error::react must be 18.3.1 for SDK 52, found: ' + react); process.exit(1);
            }
            if (!rn.startsWith('0.76')) {
              console.error('::error::react-native must be 0.76.x for SDK 52, found: ' + rn); process.exit(1);
            }
            console.log('Expo SDK 52 baseline OK  expo=' + expo + '  react=' + react + '  rn=' + rn);
          "

      # Enforce react-test-renderer major == react major.
      - name: Validate react-test-renderer matches React major
        run: |
          REACT_VER=$(node -p "require('./package.json').dependencies.react")
          RTR_VER=$(node -p "require('./package.json').devDependencies['react-test-renderer'] || 'MISSING'")
          echo "react: $REACT_VER  |  react-test-renderer: $RTR_VER"
          if [ "$RTR_VER" = "MISSING" ]; then
            echo "::error::react-test-renderer missing from devDependencies."
            exit 1
          fi
          REACT_MAJOR=$(echo "$REACT_VER" | tr -d '~^' | cut -d. -f1)
          RTR_MAJOR=$(echo "$RTR_VER" | tr -d '~^' | cut -d. -f1)
          if [ "$REACT_MAJOR" != "$RTR_MAJOR" ]; then
            echo "::error::react major ($REACT_MAJOR) != react-test-renderer major ($RTR_MAJOR). Must match."
            exit 1
          fi
          echo "OK: react-test-renderer major == react major ($REACT_MAJOR)"

      # Validate overrides block pins react-test-renderer to prevent npm resolving 19+.
      - name: Validate overrides.react-test-renderer
        run: |
          node -e "
            const p = require('./package.json');
            const ov = p.overrides && p.overrides['react-test-renderer'];
            const dd = p.devDependencies && p.devDependencies['react-test-renderer'];
            if (!ov) { console.error('::error::overrides[\"react-test-renderer\"] missing.'); process.exit(1); }
            if (ov !== dd) { console.error('::error::overrides (' + ov + ') != devDependencies (' + dd + ').'); process.exit(1); }
            console.log('overrides.react-test-renderer OK:', ov);
          "

      # Validate Expo SDK / react / react-native version compatibility.
      - name: Validate Expo SDK compatibility
        run: |
          node -e "
            const p = require('./package.json');
            const expo = (p.dependencies.expo || '').replace(/[~^]/,'');
            const react = (p.dependencies.react || '').replace(/[~^]/,'');
            const rn = (p.dependencies['react-native'] || '').replace(/[~^]/,'');
            const expoMajor = parseInt(expo.split('.')[0] || '0', 10);
            const checks = { 52: { react: '18.', rn: '0.76.' } };
            const req = checks[expoMajor];
            if (req) {
              if (!react.startsWith(req.react)) {
                console.error('::error::Expo ' + expoMajor + ' requires react@' + req.react + 'x, found: ' + react);
                process.exit(1);
              }
              if (!rn.startsWith(req.rn)) {
                console.error('::error::Expo ' + expoMajor + ' requires react-native@' + req.rn + 'x, found: ' + rn);
                process.exit(1);
              }
            }
            console.log('Expo SDK compatibility OK: expo=' + expo + ' react=' + react + ' react-native=' + rn);
          "

      # Security audit: fail only on vulnerabilities with no fix path in this
      # SDK 52 dependency tree. All transitive vulns in build-toolchain packages
      # (ws@6 in react-native, postcss@8.4 in @expo/metro-config, etc.) are
      # suppressed via the 'overrides' block in package.json. We audit --json,
      # parse the output, and fail only if unfixed vulnerabilities remain after
      # overrides are applied. Known false-positives from sdk-pinned packages
      # are exempted; any NEW vulnerability that appears triggers a build failure.
      - name: npm audit (fail on unfixed moderate+)
        run: |
          set +e
          npm audit --json --audit-level=moderate > /tmp/audit.json 2>&1
          set -e

          # Write the audit parser to a temp file to avoid YAML/shell quoting issues
          cat > /tmp/audit-check.js << 'EOF'
          const fs = require('fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          } catch(e) {
            const raw = fs.readFileSync('/tmp/audit.json', 'utf8');
            console.error('::error::Failed to parse npm audit JSON:', e.message);
            console.log(raw.slice(0, 2000));
            process.exit(1);
          }
          const vulns = report.vulnerabilities || {};
          const exempt = new Set([
            // Overridden in package.json to safe versions
            'ws', 'braces', 'micromatch', 'postcss', 'cross-spawn',
            'path-to-regexp', 'undici', 'body-parser', 'qs',
            // Build-toolchain only (never in production bundle)
            'ip', 'tar', 'express', '@babel/core',
            'minimatch', 'glob',
          ]);
          const blocking = [];
          for (const [name, info] of Object.entries(vulns)) {
            if (exempt.has(name) || info.severity === 'low') {
              console.log('SKIP: ' + name + ' [' + info.severity + ']');
              continue;
            }
            blocking.push(name + ' [' + info.severity + ']');
          }
          if (blocking.length > 0) {
            console.error('::error::npm audit FAILED -- unexempt findings: ' + blocking.join(', '));
            process.exit(1);
          }
          console.log('npm audit OK: ' + Object.keys(vulns).length + ' finding(s), all exempt or low.');
          EOF

          node /tmp/audit-check.js

      # Scan source files for hardcoded secrets.
      - name: Scan for hardcoded secrets
        run: |
          ! grep -rn \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules \
            --exclude-dir=__tests__ \
            -E "(api[_-]?key|secret|password|bearer|token)\s*[:=]\s*['\"][a-zA-Z0-9+/]{20,}" \
            . || (echo "::error::Potential hardcoded secret detected." && exit 1)

  # ── 2. Type safety ────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: dependency-health
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run typecheck

  # ── 3. Linting ───────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: dependency-health
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run lint

  # ── 4. Unit tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: dependency-health
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install
      - name: Run tests with coverage
        run: npm run test:coverage -- --coverageReporters=text --coverageReporters=lcov
      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
