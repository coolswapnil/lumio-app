name: Generate Release Keystore (one-off)

# Run this ONCE manually, copy the output, add secrets, then delete this file.
on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate & print keystore
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore and print secrets
        run: |
          keytool -genkey -v \
            -keystore lumio-release.keystore \
            -alias lumio \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "LumioRelease2024!" \
            -keypass "LumioRelease2024!" \
            -dname "CN=Lumio App, OU=Mobile, O=Lumio, L=Unknown, ST=Unknown, C=US"

          echo ""
          echo "============================================================"
          echo " COPY THESE VALUES INTO GITHUB SECRETS (see instructions)"
          echo "============================================================"
          echo ""
          echo "--- Secret: KEYSTORE_PASSWORD ---"
          echo "LumioRelease2024!"
          echo ""
          echo "--- Secret: KEY_PASSWORD ---"
          echo "LumioRelease2024!"
          echo ""
          echo "--- Secret: KEY_ALIAS ---"
          echo "lumio"
          echo ""
          echo "--- Secret: KEYSTORE_BASE64 (copy the entire block below) ---"
          base64 -w 0 lumio-release.keystore
          echo ""
          echo "============================================================"
          echo " IMPORTANT: After adding all 4 secrets, DELETE this workflow"
          echo " file from the repo so it is never run again."
          echo "============================================================"
